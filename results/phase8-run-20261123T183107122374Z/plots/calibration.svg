<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">TraceRecover calibration diagram</title>
<desc id="chart-desc">Confidence is one minus the heuristic uncertainty score. Points show empirical success by equal-width confidence bins; the diagonal is perfect empirical agreement, not proof of statistical calibration.</desc>
