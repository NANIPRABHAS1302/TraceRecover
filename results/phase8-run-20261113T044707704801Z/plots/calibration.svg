<text class="label" x="88.0" y="326.0" text-anchor="end">0.4</text>
<text class="label" x="372.0" y="500.0" text-anchor="middle">0.4</text>
<line class="grid" x1="100.0" y1="244.0" x2="780.0" y2="244.0"/>
<line class="grid" x1="508.0" y1="88.0" x2="508.0" y2="478.0"/>
<text class="label" x="88.0" y="248.0" text-anchor="end">0.6</text>
<text class="label" x="508.0" y="500.0" text-anchor="middle">0.6</text>
