<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">TraceRecover calibration diagram</title>
<desc id="chart-desc">Confidence is one minus the heuristic uncertainty score. Points show empirical success by equal-width confidence bins; the diagonal is perfect empirical agreement, not proof of statistical calibration.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#222}.grid{stroke:#d9d9d9;stroke-width:1}.axis{stroke:#444;stroke-width:1.4}.ideal{stroke:#666;stroke-dasharray:6 5;stroke-width:1.5}.line{fill:none;stroke-width:2}.point{stroke:#fff;stroke-width:1.5}.label{font-size:12px}.small{font-size:11px}</style>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="600">TraceRecover calibration diagram</text>
<text x="480" y="62" text-anchor="middle" font-size="12">Empirical diagnostic; heuristic confidence is not a calibrated probability</text>
<line class="grid" x1="100.0" y1="478.0" x2="780.0" y2="478.0"/>
<line class="grid" x1="100.0" y1="88.0" x2="100.0" y2="478.0"/>
