<text class="label" x="644.0" y="500.0" text-anchor="middle">0.8</text>
<line class="grid" x1="100.0" y1="88.0" x2="780.0" y2="88.0"/>
<line class="grid" x1="780.0" y1="88.0" x2="780.0" y2="478.0"/>
<text class="label" x="88.0" y="92.0" text-anchor="end">1.0</text>
<text class="label" x="780.0" y="500.0" text-anchor="middle">1.0</text>
<line class="axis" x1="100.0" y1="88.0" x2="100.0" y2="478.0"/>
<line class="axis" x1="100.0" y1="478.0" x2="780.0" y2="478.0"/>
<line class="ideal" x1="100.0" y1="478.0" x2="780.0" y2="88.0"/>
<text class="label" x="440.0" y="530.0" text-anchor="middle">Mean heuristic confidence</text>
<text class="label" transform="translate(28 283.0) rotate(-90)" text-anchor="middle">Observed task success</text>
<circle class="point" cx="100.0" cy="88.0" r="5" fill="#4c78a8"><title>0% failure, bin 0, n=1, confidence=0.000, accuracy=1.000</title></circle>
