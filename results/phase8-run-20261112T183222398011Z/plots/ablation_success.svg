<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Ablation task success</title>
<desc id="chart-desc">Grouped bars show task-success rates for TraceRecover and three single-component ablations at each injected failure rate. Bar labels show successes over tasks.</desc>
