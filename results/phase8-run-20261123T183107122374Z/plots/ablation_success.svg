<text class="label" x="88.0" y="248.0" text-anchor="end">0.6</text>
<line class="grid" x1="100.0" y1="166.0" x2="780.0" y2="166.0"/>
<text class="label" x="88.0" y="170.0" text-anchor="end">0.8</text>
<line class="grid" x1="100.0" y1="88.0" x2="780.0" y2="88.0"/>
<text class="label" x="88.0" y="92.0" text-anchor="end">1.0</text>
<line class="axis" x1="100.0" y1="88.0" x2="100.0" y2="478.0"/>
<line class="axis" x1="100.0" y1="478.0" x2="780.0" y2="478.0"/>
<text class="label" transform="translate(28 283.0) rotate(-90)" text-anchor="middle">Task success rate</text>
