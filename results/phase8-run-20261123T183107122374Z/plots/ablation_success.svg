<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Ablation task success</title>
<desc id="chart-desc">Grouped bars show task-success rates for TraceRecover and three single-component ablations at each injected failure rate. Bar labels show successes over tasks.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#222}.grid{stroke:#d9d9d9;stroke-width:1}.axis{stroke:#444;stroke-width:1.4}.label{font-size:12px}.small{font-size:10px}</style>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="600">Ablation task success</text>
<text x="480" y="62" text-anchor="middle" font-size="12">Task success rate; labels show successes / tasks</text>
<line class="grid" x1="100.0" y1="478.0" x2="780.0" y2="478.0"/>
<text class="label" x="88.0" y="482.0" text-anchor="end">0.0</text>
<line class="grid" x1="100.0" y1="400.0" x2="780.0" y2="400.0"/>
<text class="label" x="88.0" y="404.0" text-anchor="end">0.2</text>
<line class="grid" x1="100.0" y1="322.0" x2="780.0" y2="322.0"/>
<text class="label" x="88.0" y="326.0" text-anchor="end">0.4</text>
